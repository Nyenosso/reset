name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Database + RLS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql > /dev/null
          npm run test:rls
      - name: End-to-end (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
